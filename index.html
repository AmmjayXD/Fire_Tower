<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08150d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>🔥 Fire Tower</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--glass:#0b2014d9;--line:#ffffff22;--gold:#fde047}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;color:#eaf3ea;font:14px/1.4 Kanit,'Noto Sans Thai',system-ui,sans-serif;touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;background:radial-gradient(900px 380px at 50% 108%,#7c2d1266,transparent 70%),radial-gradient(1100px 600px at 50% -10%,#2b6b3e,transparent 70%),linear-gradient(#06130b,#0b1f13 60%,#07140c) fixed}
#emb{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#emb i{position:absolute;bottom:-24px;font-style:normal;color:#fb923c;text-shadow:0 0 8px #f97316;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}12%{opacity:.85}100%{transform:translate(36px,-108vh);opacity:0}}
button{font:inherit;color:#fff;border:0;border-radius:14px;padding:10px 16px;min-height:44px;background:linear-gradient(#34633f,#264b31);box-shadow:0 3px 0 #11301f,inset 0 1px 0 #ffffff26;cursor:pointer;transition:filter .15s,transform .1s}
button:hover{filter:brightness(1.2)}button:active{transform:translateY(2px);box-shadow:0 1px 0 #11301f}button:disabled{opacity:.4;pointer-events:none}
.pri{background:linear-gradient(#fb923c,#dc2626);box-shadow:0 3px 0 #7f1d1d,0 6px 18px #f9731655;font-weight:600}
input,select{font:inherit;color:inherit;width:100%;min-height:44px;padding:10px 12px;border-radius:14px;border:1px solid #2f5a3d;background:#0b1c12cc;-webkit-user-select:text;user-select:text}
section{display:none;position:relative;z-index:1;max-width:560px;margin:auto;padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
section.on{display:block}#game{max-width:1180px}
#top,#bar,details,.pc{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.mu{color:#9bbfa6;font-size:12px}
#menu,#lobby{display:none;flex-direction:column;gap:12px}#menu.on,#lobby.on{display:flex}
.hero{text-align:center;padding:22px 0 6px}.logo{font-size:44px;letter-spacing:2px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
h1{margin:4px 0;font-size:36px;letter-spacing:4px;background:linear-gradient(#fde047,#f97316,#dc2626);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px #f9731655)}
h2,h3{margin:6px 0}.code{font-size:30px;letter-spacing:6px;color:var(--gold)}
.pc{display:flex;align-items:center;gap:8px;flex:1;min-width:132px;padding:7px 10px 7px 14px;border-radius:14px;border:2px solid transparent;font-size:12px;position:relative}
.pc::before{content:'';position:absolute;left:3px;top:20%;bottom:20%;width:4px;border-radius:4px;background:var(--c);box-shadow:0 0 8px var(--c)}
.pc.turn{border-color:var(--gold);box-shadow:0 0 18px #fde04755}.pc.dead{opacity:.5;filter:grayscale(.6)}
.pc b{font-weight:600;font-size:13px}.av{font-size:26px;line-height:1}.tn{margin-left:auto;color:var(--gold);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
#lb .pc{flex:none;width:100%;font-size:15px;padding:10px 12px 10px 16px;margin-bottom:6px}
#top{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:8px;border-radius:18px}
#cmp{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle,#1b3a27,#0a170e);border:2px solid #fb923c;position:relative;flex:none;box-shadow:0 0 14px #fb923c66,inset 0 0 10px #0008}
#cmp b{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:9px;color:var(--gold)}
#ar{position:absolute;inset:8px;transition:transform 1s cubic-bezier(.3,1.5,.5,1)}
#ar::before{content:'';position:absolute;left:50%;top:0;margin-left:-6px;border:6px solid transparent;border-bottom:16px solid #fb923c;border-top:0;filter:drop-shadow(0 0 4px #f97316)}
#ar::after{content:'';position:absolute;left:50%;top:14px;width:4px;height:14px;margin-left:-2px;background:#fb923c99;border-radius:2px}
#st{flex:1;min-width:0}.chips{display:flex;gap:5px;flex-wrap:wrap}.chips span{background:#0007;border-radius:10px;padding:3px 8px;font-size:12px;white-space:nowrap}
#top button{flex:none;padding:6px 12px;font-size:18px}
#main{display:flex;flex-direction:column;gap:8px}
#bw{position:relative;display:flex;justify-content:center;align-items:center;padding:8px}
#side{display:flex;flex-direction:column;gap:8px;min-width:0}
#pl{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
#board{--s:max(22px,min(calc((100vw - 48px)/14),calc((100dvh - 380px)/14),56px));display:grid;grid-template-columns:repeat(14,var(--s));grid-auto-rows:var(--s);gap:1px;padding:5px;border-radius:12px;background:#0a160c;box-shadow:0 0 0 6px #5b3a1e,0 0 0 8px #8a5a2b,0 14px 40px #000a;transition:box-shadow .4s}
#board.mine{box-shadow:0 0 0 6px #5b3a1e,0 0 0 8px var(--gold),0 0 30px #fde04788,0 14px 40px #000a}
#wfx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6;border-radius:16px}
#wfx span{position:absolute;font-size:24px;opacity:0;animation:wv 2.2s ease-in-out both}
@keyframes wv{0%{opacity:0;transform:translate(0,0) rotate(0)}15%{opacity:.9}85%{opacity:.9}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(40deg)}}
.c{position:relative;display:flex;align-items:center;justify-content:center;background:#22562f;border-radius:3px;font-size:calc(var(--s)*.6);cursor:pointer}
.c.a{background:#276137}
.tr::after{content:'🌲';opacity:.35;font-size:calc(var(--s)*.55)}
.t0{background:#7a2a2a!important}.t1{background:#1f6b3a!important}.t2{background:#27508f!important}.t3{background:#8a6d12!important}
.t0.a{background:#8a3333!important}.t1.a{background:#257a45!important}.t2.a{background:#2f5fa8!important}.t3.a{background:#9c7c16!important}
.k{outline:2px solid #fb923c;outline-offset:-2px;z-index:1}.k::after{content:'🗼';filter:drop-shadow(0 0 4px #fff9)}
.tav::before{content:attr(data-av);position:absolute;font-size:calc(var(--s)*.62);z-index:1;filter:drop-shadow(0 1px 2px #000)}
.g::after{content:'';width:72%;height:72%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7c2,#fbbf24 30%,#f97316 65%,#b91c1c);box-shadow:0 0 8px #f97316,0 0 14px #ef444488;animation:fl 1.3s ease-in-out infinite alternate}
.e{background:radial-gradient(circle,#fde047,#ea580c 60%,#7f1d1d)!important;cursor:default}.e::after{content:'🔥';animation:fl .9s infinite alternate}
.bn{background:#3a1208!important}.bn::after,.k.bn::after{content:'🔥';animation:fl .8s infinite alternate;filter:none}
.f{background:repeating-linear-gradient(45deg,#7c3aed,#7c3aed 4px,#5b21b6 4px,#5b21b6 8px)!important;box-shadow:inset 0 0 0 2px #c4b5fd}
.hl{animation:pu 1s infinite;box-shadow:inset 0 0 0 2px var(--gold)}
.pv{box-shadow:inset 0 0 0 99px #fb923ccc,0 0 0 2px #fff;z-index:2}.pvw{box-shadow:inset 0 0 0 99px #38bdf8cc,0 0 0 2px #fff;z-index:2}
.pvb{box-shadow:inset 0 0 0 99px #a78bfacc,0 0 0 2px #fff;z-index:2}.pbad{box-shadow:inset 0 0 0 99px #ef444488,0 0 0 2px #f00;z-index:2}
@keyframes fl{to{transform:scale(1.1) rotate(5deg);filter:brightness(1.25)}}
@keyframes pu{50%{background-color:#fde04788}}
@keyframes pop{0%{transform:scale(0) rotate(-40deg);filter:brightness(3)}55%{transform:scale(1.4)}100%{transform:none}}
@keyframes drop{0%{transform:translateY(-150%) scale(1.5);opacity:0}65%{transform:translateY(6%);opacity:1}80%{transform:translateY(-4%)}100%{transform:none}}
@keyframes boom{0%{filter:brightness(4);transform:scale(1.35)}35%{transform:scale(.88)}100%{filter:none;transform:none}}
@keyframes puff{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translateY(-150%) scale(1.6)}}
.pop{animation:pop .8s cubic-bezier(.2,1.4,.4,1) backwards;z-index:3}.drop{animation:drop .9s ease-in backwards;z-index:3}.boom{animation:boom 1s ease-out backwards;z-index:3}
.gh{position:absolute;font-style:normal;font-size:calc(var(--s)*.8);animation:puff 1.1s ease-out both;pointer-events:none;z-index:4}
#bar{padding:12px;border-radius:16px;display:flex;flex-direction:column;gap:8px}
.er{color:#fca5a5;font-size:12px}
#hand{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:18px 8px 12px;min-height:160px;scroll-snap-type:x proximity}
#hand>.cd:first-child{margin-left:auto}#hand>.cd:last-child{margin-right:auto}
.cd{position:relative;flex:0 0 88px;height:128px;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;box-shadow:0 6px 16px #0009,inset 0 0 0 2px #ffffff40,inset 0 -30px 40px #0003;cursor:pointer;transition:transform .2s,box-shadow .2s;color:#fff;scroll-snap-align:center;overflow:hidden}
.cd::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff33 45%,transparent 60%);transform:translateX(-120%);pointer-events:none}
.cd.sel::before{animation:shine 1.8s infinite}@keyframes shine{to{transform:translateX(120%)}}
.cd b{font-size:10.5px;font-weight:600;line-height:1.1}.cd em{font-style:normal;font-size:8.5px;line-height:1.1;opacity:.92}
.cd.fire{background:linear-gradient(160deg,#fb923c,#b91c1c)}.cd.wind{background:linear-gradient(160deg,#94a3b8,#475569)}.cd.water{background:linear-gradient(160deg,#38bdf8,#1d4ed8)}.cd.brk{background:linear-gradient(160deg,#a78bfa,#5b21b6)}.cd.evt{background:linear-gradient(160deg,#fde047,#b45309)}
.cd.sel{transform:translateY(-12px) scale(1.04);box-shadow:0 0 0 3px #fff,0 10px 24px #000a}
@keyframes deal{0%{opacity:0;transform:translate(70px,-50px) rotate(14deg) scale(.7)}100%{opacity:1;transform:none}}
.deal{animation:deal .7s cubic-bezier(.2,.9,.3,1.2) backwards}
.zi{position:absolute;top:2px;right:3px;width:24px;height:24px;border-radius:50%;background:#0007;display:flex;align-items:center;justify-content:center;font-size:12px;text-decoration:none;z-index:3}
.big{font-size:30px}.mg{display:grid;gap:1px}.mg i{width:9px;height:9px;border-radius:2px;background:#0003}.mg i.x{background:#fff;box-shadow:0 0 4px #fff8}.mg i.y{background:#fde047}
details{border-radius:14px;padding:8px 12px}summary{cursor:pointer;min-height:28px}
#lgb div{font-size:12px;padding:2px 0;border-bottom:1px solid #ffffff10}
#dbg .row{margin:6px 0}#dbg .row>*{flex:none}#dbg button{padding:6px 10px;min-height:36px}#dbg select{width:auto}#dbg label{font-size:12px}
#toasts{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;width:min(92vw,420px);pointer-events:none}
.ts{padding:9px 12px;border-radius:12px;background:#000d;border-left:4px solid var(--c);font-size:13px;animation:in .3s,out .5s 3.7s forwards}
@keyframes in{from{opacity:0;transform:translateY(-12px)}}@keyframes out{to{opacity:0;transform:translateY(-8px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.bn2{position:absolute;left:50%;top:38%;font-size:clamp(24px,7vw,50px);font-weight:600;text-align:center;white-space:nowrap;padding:10px 24px;border-radius:22px;background:#000b;color:#fff;border:2px solid var(--bc);box-shadow:0 0 40px var(--bc);text-shadow:0 0 18px var(--bc);animation:ban 2.6s ease both}
@keyframes ban{0%{opacity:0;transform:translate(-50%,0) scale(.4)}14%{opacity:1;transform:translate(-50%,0) scale(1.12)}24%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-24px) scale(1.05)}}
.cf{position:absolute;top:-30px;font-style:normal;animation:fc linear forwards}
@keyframes fc{to{transform:translateY(110vh) rotate(540deg)}}
.mb{position:fixed;inset:0;background:#000b;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px;animation:in .25s}
.mc{background:linear-gradient(#173222,#0e2016);border-radius:20px;padding:16px;width:min(100%,580px);max-height:90dvh;overflow:auto;box-shadow:0 0 0 2px #2f5a3d,0 20px 60px #000c;font-size:13px;-webkit-user-select:text;user-select:text}
.mc li{margin:5px 0}.cat,.hv{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0;justify-content:center}.cw{text-align:center}.cw .cd,.hv .cd{cursor:default}
.dt{display:flex;gap:26px;align-items:center;flex-wrap:wrap;justify-content:center;padding:10px 0}.dt .cd{zoom:1.8;flex:none;cursor:default}
.sum{text-align:center}.trophy{font-size:60px;animation:float 2s ease-in-out infinite}
.rk{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:#ffffff12;margin:6px 0;text-align:left}
.rk.w{background:linear-gradient(90deg,#fde04733,#fb923c22);border:1px solid #fde04799}
.md2{font-size:28px}.sp{display:inline-block;font-size:11px;background:#0006;border-radius:8px;padding:2px 7px;margin:3px 3px 0 0}.sp.g{background:#ca8a0455}
.stats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}.stats span{background:#0006;border-radius:10px;padding:4px 10px;font-size:12px}
@media(hover:none){.zi{width:28px;height:28px;font-size:14px}}
@media(min-width:700px){.cd{flex-basis:104px;height:152px}.cd b{font-size:12px}.cd em{font-size:10px}.mg i{width:11px;height:11px}.big{font-size:36px}body{font-size:15px}}
@media(orientation:portrait){#hand{position:sticky;bottom:0;background:linear-gradient(transparent,#06130bf0 35%)}}
@media(min-width:900px),(min-width:700px) and (orientation:landscape){
 #main{flex-direction:row;align-items:flex-start}#bw{flex:none}#side{flex:1}
 #board{--s:max(22px,min(calc((100vw - 470px)/14),calc((100dvh - 270px)/14),54px))}
 #pl{flex-direction:column;overflow:visible}
}
</style></head><body>
<section id="menu" class="on">
 <div class="hero"><div class="logo">🌲🔥🗼🔥🌲</div><h1>FIRE TOWER</h1><div class="mu">🔥 สู้ไฟด้วยไฟ · 🗼 หอคอยสุดท้ายที่รอดเป็นผู้ชนะ 🏆</div></div>
 <input id="nm" maxlength="12" placeholder="ชื่อของคุณ">
 <button class="pri" id="bCreate">🏕️ สร้างห้องออนไลน์</button>
 <div class="row"><input id="cd" maxlength="4" placeholder="รหัสห้อง 4 ตัว" style="text-transform:uppercase"><button id="bJoin">เข้าร่วมห้อง</button></div>
 <div class="row"><select id="tn"><option value="2">2 ผู้เล่น</option><option value="3">3 ผู้เล่น</option><option value="4" selected>4 ผู้เล่น</option></select><button id="bTest">🧪 โหมดทดสอบ</button></div>
 <button id="bRules">📖 วิธีเล่น & การ์ดทั้งหมด</button>
</section>
<section id="lobby"><div id="lb"></div></section>
<section id="game">
 <div id="top"><div id="cmp"><b>N</b><div id="ar"></div></div><div id="st"></div><button id="bHand" title="ดูไพ่ในมือ">🃏</button><button id="bHelp" title="วิธีเล่น">❓</button></div>
 <div id="main"><div id="bw"><div id="board"></div><div id="wfx"></div></div>
 <div id="side"><div id="pl"></div><div id="bar"></div><details id="lg"><summary>📜 บันทึกเหตุการณ์</summary><div id="lgb"></div></details></div></div>
 <div id="hand"></div>
 <details id="dbg" hidden><summary>🛠 เครื่องมือทดสอบ</summary>
  <div class="row"><span class="mu">ลม:</span><button data-d="wind:N">⬆️</button><button data-d="wind:E">➡️</button><button data-d="wind:S">⬇️</button><button data-d="wind:W">⬅️</button></div>
  <div class="row"><select id="dcard"></select><button data-d="give">➕ เพิ่มการ์ดให้ผู้เล่นปัจจุบัน</button></div>
  <div class="row"><span class="mu">เผาหอคอย:</span><button data-d="burn:0">1</button><button data-d="burn:1">2</button><button data-d="burn:2">3</button><button data-d="burn:3">4</button></div>
  <div class="row"><label><input type="checkbox" id="dbot" style="width:auto"> บอทเล่นแทนผู้เล่น 2–4</label><label><input type="checkbox" id="dedit" style="width:auto"> แก้กระดาน (แตะ: ว่าง→ไฟ→กันไฟ)</label></div>
  <div class="row"><button data-d="skip">⏭ ข้ามตา</button><button data-d="reset">🔄 รีเซ็ตเกม</button><button data-d="menu">🏠 เมนู</button></div>
  <div class="mu">โหมดทดสอบ: ควบคุมได้ทุกผู้เล่น (Hot-seat) มุมมองจะสลับตามคนที่ถึงตา</div>
 </details>
</section>
<div id="emb"></div><div id="fx"></div><div id="toasts"></div><div id="md"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ================= ENGINE ================= */
(function(G){
'use strict';
const N=14,C=N*N,D={N:[-1,0],E:[0,1],S:[1,0],W:[0,-1]},DN=['N','E','S','W'];
const ix=(r,c)=>r*N+c,inb=(r,c)=>r>=0&&c>=0&&r<N&&c<N,rnd=n=>Math.random()*n|0;
const P2=[[0,0],[0,1]],P3=[[0,0],[0,1],[0,2]],P4=[[0,0],[0,1],[0,2],[0,3]],SQ=[[0,0],[0,1],[1,0],[1,1]],EL=[[0,0],[1,0],[1,1]],TT=[[0,0],[0,1],[0,2],[1,1]],PL=[[0,1],[1,0],[1,1],[1,2],[2,1]];
const DEFS=[
['fire','flare','Flare Up',3,P3],['fire','snag','Burning Snag',2,SQ],['fire','boom','Explosion',1],['fire','ember','Ember',2],['fire','spark','Spark',2,P2],['fire','back','Backdraft',2,EL],['fire','ridge','Ridge Fire',1,P4],['fire','whirl','Fire Whirl',1,TT],
['wind','N','North Wind',4],['wind','E','East Wind',4],['wind','S','South Wind',4],['wind','W','West Wind',4],
['water','rain','Downpour',3,P3],['water','splash','Splash',2,P2],['water','burst','Cloudburst',2,SQ],['water','hose','Fire Hose',2,P4],['water','spr','Sprinkler',1,PL],['water','smoke','Smokejumper',2],
['brk','dozer','Dozer Line',3,P3],['brk','scratch','Scratch Line',3,P2],['brk','trench','Trench',2,P4],['brk','corner','Corner Cut',2,EL],
['evt','storm','Firestorm',1],['evt','aid','Mutual Aid',1]];
const CARDS=[];DEFS.forEach(d=>{for(let i=0;i<d[3];i++)CARDS.push({id:CARDS.length,k:d[0],key:d[1],n:d[2],p:d[4]||null})});
const CORN=[[0,0],[0,N-1],[N-1,N-1],[N-1,0]],SIDE=[['N','W'],['N','E'],['S','E'],['S','W']];
const TC=CORN.map(([r,c])=>{const a=r?-1:1,b=c?-1:1,o=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++)o.push(ix(r+a*i,c+b*j));return o});
const ET=[ix(6,6),ix(6,7),ix(7,6),ix(7,7)];
const nb4=i=>{const r=i/N|0,c=i%N,o=[];for(const[a,b]of Object.values(D))if(inb(r+a,c+b))o.push(ix(r+a,c+b));return o};
const nb8=i=>{const r=i/N|0,c=i%N,o=[];for(let a=-1;a<2;a++)for(let b=-1;b<2;b++)if((a||b)&&inb(r+a,c+b))o.push(ix(r+a,c+b));return o};
const dist=(i,[r,c])=>Math.abs((i/N|0)-r)+Math.abs(i%N-c);
const ta=(S,i)=>S.players.some(p=>TC[p.seat].includes(i));
const pcells=(p,q,R,Cc)=>p.map(([r,c])=>{for(let i=0;i<(q&3);i++)[r,c]=[c,-r];return[R+r,Cc+c]});
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- เครือข่าย P2P (PeerJS / WebRTC): โฮสต์เป็นผู้ตัดสินเกม ---------- */
const PCFG={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};
const tok=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const cl=n=>String(n||'ผู้เล่น').replace(/[<>&]/g,'').trim().slice(0,12)||'ผู้เล่น';
const nm=()=>{sv.name=cl($('#nm').value);sav();return sv.name};
const live=p=>p.local||p.bot||(p.conn&&p.conn.open);
function toP(i,o){const p=RM.pl[i];if(!p)return;if(p.local)onNet(o);else if(p.conn&&p.conn.open)p.conn.send(o)}
function push(){
 RM.pl.forEach((p,i)=>toP(i,RM.S?{t:'game',you:i,v:FT.view(RM.S,i)}:{t:'lobby',code:RM.code,you:i,pl:RM.pl.map(x=>({n:x.name,b:!!x.bot,on:!!live(x)}))}));
}
function tick(){
 clearTimeout(RM.tm);const s=RM.S;if(!s||s.over)return;
 const w=FT.who(s),p=RM.pl[w];
 if(!p||!(p.bot||!live(p)))return;
 RM.tm=setTimeout(()=>{
  if(!RM||RM.S!==s||s.over)return;
  let e=FT.act(s,w,FT.bot(s,w));if(e)e=FT.act(s,w,FT.bot(s,w,1));
  if(e)console.log('bot error',e);
  push();tick();
 },p.bot?1700:12000);
}
function hmsg(i,m){
 if(m.t=='mv'){if(!RM.S)return;const e=FT.act(RM.S,i,m.m);if(e)toP(i,{t:'err',m:e});else{push();tick()}return}
 if(i)return;
 if(m.t=='bot'&&!RM.S&&RM.pl.length<4){RM.pl.push({tok:'',name:'🤖 บอท '+(RM.pl.filter(p=>p.bot).length+1),bot:1});push()}
 if(m.t=='rm'&&!RM.S){const k=RM.pl.map(p=>!!p.bot).lastIndexOf(true);if(k>0){RM.pl.splice(k,1);push()}}
 if(m.t=='start'&&!RM.S&&RM.pl.length>=2){RM.S=FT.create(RM.pl.map(p=>({name:p.name,bot:p.bot})));push();tick()}
 if(m.t=='again'&&RM.S&&RM.S.over){clearTimeout(RM.tm);RM.S=null;push()}
}
function hdata(c,m){
 if(!RM||!m)return;
 if(m.t=='join'){
  if(RM.S)return c.send({t:'err',m:'ห้องนี้เริ่มเกมไปแล้ว'});
  if(RM.pl.length>=4)return c.send({t:'err',m:'ห้องเต็ม'});
  const p={tok:tok(),name:cl(m.name),conn:c};RM.pl.push(p);
  c.send({t:'joined',code:RM.code,tok:p.tok,you:RM.pl.length-1});push();return;
 }
 if(m.t=='rejoin'){
  const i=RM.pl.findIndex(p=>p.tok&&p.tok==m.tok);
  if(i<0)return c.send({t:'gone'});
  const p=RM.pl[i];if(p.conn&&p.conn!==c)try{p.conn.close()}catch{}
  p.conn=c;c.send({t:'joined',code:RM.code,tok:p.tok,you:i});push();tick();return;
 }
 const i=RM.pl.findIndex(p=>p.conn===c);if(i>0)hmsg(i,m);
}
function hclose(c){
 if(!RM)return;const i=RM.pl.findIndex(p=>p.conn===c);if(i<0)return;
 if(!RM.S)RM.pl.splice(i,1);else RM.pl[i].conn=null;
 push();tick();
}
function hostRoom(){
 if(typeof Peer=='undefined')return toast('โหลด PeerJS ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต','#ef4444');
 const code=Math.random().toString(36).slice(2,6).toUpperCase().padEnd(4,'X');
 if(peer)peer.destroy();
 peer=new Peer('ftower-'+code,PCFG);
 peer.on('error',e=>{if(e.type=='unavailable-id')hostRoom();else toast('เชื่อมต่อเซิร์ฟเวอร์จับคู่ไม่ได้: '+e.type,'#ef4444')});
 peer.on('open',()=>{
  isHost=1;mode='online';RM={code,pl:[{tok:'',name:nm(),local:1}],S:null,tm:0};
  onNet({t:'joined',code,you:0,h:1});push();
 });
 peer.on('connection',c=>{c.on('data',m=>hdata(c,m));c.on('close',()=>hclose(c))});
}
function guestRoom(code,first){
 if(typeof Peer=='undefined')return toast('โหลด PeerJS ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต','#ef4444');
 if(peer)peer.destroy();isHost=0;RM=null;
 peer=new Peer(PCFG);
 peer.on('error',e=>{
  if(e.type=='peer-unavailable'){toast('ไม่พบห้องนี้ หรือโฮสต์ปิดหน้าเว็บไปแล้ว','#ef4444');if(first.t=='rejoin'){delete sv.room;sav();mode='';show('menu')}}
  else toast('เชื่อมต่อไม่ได้: '+e.type,'#ef4444');
 });
 peer.on('open',()=>{
  gconn=peer.connect('ftower-'+code,{reliable:true,serialization:'json'});
  gconn.on('open',()=>gconn.send(first));
  gconn.on('data',onNet);
  gconn.on('close',()=>{if(mode=='online'&&sv.room&&!isHost){toast('หลุดการเชื่อมต่อ กำลังต่อใหม่…','#ef4444');setTimeout(()=>guestRoom(code,{t:'rejoin',tok:sv.tok}),2000)}});
 });
}
function raw(o){
 if(isHost)hmsg(0,o);
 else if(gconn&&gconn.open)gconn.send(o);
 else toast('ยังไม่ได้เชื่อมต่อ','#ef4444');
}
function onNet(m){
 if(m.t=='joined'){rc=m.code;if(!m.h){sv.room=m.code;sv.tok=m.tok}else delete sv.room;sav();mode='online'}
 else if(m.t=='lobby'){mode='online';me=m.you;seen=0;lw=-1;lo=0;S=null;pB=pH=pW=null;aB={};aH={};$('#md').innerHTML='';rLobby(m)}
 else if(m.t=='game'){mode='online';me=m.you;S=m.v;show('game');$('#dbg').hidden=true;update()}
 else if(m.t=='err')toast('⚠️ '+m.m,'#ef4444');
 else if(m.t=='gone'){delete sv.room;sav();mode='';show('menu');toast('ห้องนี้ไม่อยู่แล้ว','#ef4444')}
}
function leave(){
 delete sv.room;sav();mode='';clearTimeout(RM&&RM.tm);RM=null;isHost=0;
 try{gconn&&gconn.close()}catch{}try{peer&&peer.destroy()}catch{}peer=gconn=null;show('menu');
}
function send(m){
 U={};
 if(mode=='online'){raw({t:'mv',m});return}
 const e=FT.act(T.S,FT.who(T.S),m);if(e)toast('⚠️ '+e,'#ef4444');
 S=T.S;update();botLoop();
}

function botLoop(){
 clearTimeout(T.t);if(mode!='test'||S.over)return;
 const w=FT.who(S);
 if(S.players[w].bot)T.t=setTimeout(()=>{if(mode!='test')return;let e=FT.act(S,w,FT.bot(S,w));if(e)e=FT.act(S,w,FT.bot(S,w,1));if(e){toast('bot: '+e,'#ef4444');return}update();botLoop()},1500);
}
$('#dbg').onclick=e=>{
 const a=e.target.dataset.d;if(!a||mode!='test')return;const s=T.S,[k,v]=a.split(':');
 if(k=='menu'){mode='';clearTimeout(T.t);show('menu');return}
 if(k=='reset')return startTest(s.players.length);
 if(k=='wind'){s.wind=v}
 if(k=='burn'){const p=s.players[+v];if(p&&!p.burned&&!s.pq.length){s.actor=s.turn;s.b[CORN[p.seat][0]*N+CORN[p.seat][1]]=1;FT.settle(s)}}
 if(k=='skip'&&!s.pq.length){s.phase='done';FT.settle(s)}
 if(k=='give'){const P=s.players[me],n=$('#dcard').value,c=CARDS.find(c=>c.n==n&&!P.hand.includes(c.id));
  if(c){s.deck=s.deck.filter(i=>i!=c.id);s.disc=s.disc.filter(i=>i!=c.id);
   if(c.k=='evt'){if(!s.pq.length){s.evq.push({id:c.id,by:me});s.disc.push(c.id);FT.settle(s)}}else P.hand.push(c.id)}}
 U={};S=T.S;update();botLoop();
};
$('#dbot').onchange=e=>{T.bots=e.target.checked?1:0;T.S.players.forEach((p,i)=>p.bot=!!(T.bots&&i>0));update();botLoop()};

/* ---------- วาดหน้าจอ ---------- */
function mv(){
 const c=CARDS[U.id],k=c.key;
 if(c.k=='wind')return U.sub=='gem'&&U.cell!=null?{t:'card',id:U.id,mode:'gem',cell:U.cell}:null;
 if(k=='boom'||k=='smoke')return U.cell!=null?{t:'card',id:U.id,cell:U.cell}:null;
 if(k=='ember')return U.to!=null?{t:'card',id:U.id,from:U.from,to:U.to}:null;
 return U.R!=null?{t:'card',id:U.id,q:U.q,R:U.R,C:U.C}:null;
}
function hlp(){
 const hl=new Set(),pv={};U.err='';
 if(!mine())return{hl,pv};
 const cur=S.pq[0],P=S.players[me],b=S.b;
 if(cur){if(cur.t=='aid')FT.aidCells(S,cur).forEach(i=>hl.add(i));return{hl,pv}}
 if(U.m=='bucket'){if(U.R!=null){const i=U.R*N+U.C;[i,...FT.nb8(i)].forEach(j=>pv[j]='pvw')}}
 else if(S.phase=='spread')FT.spread(S,S.wind).forEach(i=>hl.add(i));
 else if(U.m=='reck'){b.forEach((v,i)=>!v&&FT.nb4(i).some(j=>b[j]&1)&&hl.add(i));U.cs.forEach(i=>pv[i]='pv')}
 else if(U.m=='card'){
  const c=CARDS[U.id],k=c.key;
  if(c.k=='wind'){if(U.sub=='gem')FT.spread(S,k).forEach(i=>hl.add(i));return{hl,pv}}
  if(k=='boom'||k=='smoke')b.forEach((v,i)=>v==1&&hl.add(i));
  if(k=='ember'){
   if(U.from==null)b.forEach((v,i)=>v==1&&!FT.ta(S,i)&&hl.add(i));
   else{b.forEach((v,i)=>!v&&FT.nb4(i).some(j=>j!=U.from&&b[j]&1)&&hl.add(i));pv[U.from]='pvb'}
  }
  const m=mv();
  if(m){const r=FT.plan(S,P,m);
   if(r.e){U.err=r.e;if(c.p)FT.pcells(c.p,U.q,U.R,U.C).forEach(([y,x])=>FT.inb(y,x)&&(pv[y*N+x]='pbad'))}
   else r.d.forEach(([i])=>pv[i]={fire:'pv',water:'pvw',brk:'pvb'}[c.k])}
 }
 return{hl,pv};
}
const DUR=1100;
function diffB(){
 const now=Date.now();
 for(const k in aB)if(now>aB[k].t+DUR)delete aB[k];
 if(pB){let n=0;for(let i=0;i<C;i++){const o=pB[i],v=S.b[i];if(o==v)continue;aB[i]={c:v==1?'pop':v==2?'drop':v==3?'boom':'ghost',t:now+(n++%14)*70}}}
 pB=S.b.slice();
}
function rBoard(){
 const {hl,pv}=hlp(),seat={},now=Date.now(),cs=S.players.map(p=>CORN[p.seat][0]*N+CORN[p.seat][1]);
 S.players.forEach(p=>TC[p.seat].forEach((i,j)=>seat[i]=[p.seat,j==4?(p.burned?'💀':AV[p.seat]):'']));
 let h='';
 for(let i=0;i<C;i++){
  const v=S.b[i],r=i/N|0,c=i%N,s=seat[i];let k='c'+((r+c)&1?' a':''),st='',gh='',av='';
  if(s){k+=' t'+s[0];if(s[1]){k+=' tav';av=` data-av="${s[1]}"`}}
  if(cs.includes(i))k+=' k';
  if(v==1)k+=' g';else if(v==2)k+=' f';else if(v==3)k+=FT.ET.includes(i)?' e':' bn';
  else if(!s&&(r*7+c*13)%9==0)k+=' tr';
  if(hl.has(i))k+=' hl';if(pv[i])k+=' '+pv[i];
  const a=aB[i];
  if(a&&now<a.t+DUR){const dl=a.t-now;if(a.c=='ghost')gh=`<b class="gh" style="animation-delay:${dl}ms">💨</b>`;else{k+=' '+a.c;st=` style="animation-delay:${dl}ms"`}}
  h+=`<div class="${k}" data-i="${i}"${st}${av}>${gh}</div>`;
 }
 $('#board').innerHTML=h;$('#board').classList.toggle('mine',!!mine());
}
function rTop(){
 const dn=S.dn!=null?S.dn:S.deck.length,tn=S.st?S.st.reduce((a,x)=>a+x.t,0):0;
 $('#ar').style.transform=`rotate(${{N:0,E:90,S:180,W:270}[S.wind]}deg)`;
 $('#st').innerHTML=`<div class="chips"><span>🌬️ ${AR[S.wind]} <b>${DN[S.wind]}</b></span><span>📚 ${dn}</span><span>✋ ${S.hs}</span><span>🔁 ${tn}</span>${mode=='online'?`<span>🏕️ ${rc}</span>`:mode=='test'?'<span>🧪 ทดสอบ</span>':''}</div>`;
}
function rPl(){
 const w=FT.who(S);
 $('#pl').innerHTML=S.players.map((p,i)=>`<div class="pc ${w==i&&!S.over?'turn':''} ${p.burned?'dead':''}" style="--c:${COL[p.seat]}"><span class="av">${p.burned?'💀':AV[p.seat]}</span><div><b>${p.name}${i==me?' (คุณ)':''}${p.bot?' 🤖':''}</b><div class="mu">🃏 ${p.hn!=null?p.hn:p.hand.length} · ${p.bucket?'🪣':'🫗'} · ${p.burned?'🔥 ไหม้':'🗼 รอด'}</div></div>${w==i&&!S.over?'<span class="tn">▶</span>':''}</div>`).join('');
}
const B_=(a,l,c,d)=>`<button data-a="${a}" class="${c||''}" ${d?'disabled':''}>${l}</button>`;
function rBar(){
 const w=FT.who(S),cur=S.pq[0],P=S.players[me];let t='',bt=[];
 if(S.over){t=`🏆 <b>${S.players[S.win].name}</b> ชนะเกม!`;bt=[B_('sum','📊 ดูสรุปผล','pri')]}
 else if(P.burned&&w!=me)t=`👀 หอคอยของคุณถูกเผาแล้ว — ดูเกมต่อ · ตา <b>${S.players[w].name}</b>`;
 else if(w!=me)t=`⏳ รอ <b>${S.players[w].name}</b> ${cur?'ตัดสินใจ':'เล่น'}…`;
 else if(cur&&cur.t=='aidch'){t='🤝 <b>Mutual Aid</b> — เลือกสิ่งที่ทุกคนต้องทำ';bt=[B_('c1','🔥 วางไฟ'),B_('c2','💧 ดับไฟ'),B_('c3','♻️ ทิ้ง 3 ใบ')]}
 else if(cur&&cur.t=='aid')t=cur.ch==1?'🔥 Mutual Aid: แตะช่องที่เรืองแสงเพื่อวางไฟ (ต้องติดกองไฟ)':'💧 Mutual Aid: แตะกองไฟที่ต้องการดับ';
 else if(cur){
  const n=(U.sel||[]).length,md=cur.mode,need=md=='aid'?Math.min(3,P.hand.length):md=='trim'?P.hand.length-S.hs:0;
  t=md=='trim'?`🎁 ได้ไพ่เพิ่ม! เลือกทิ้ง <b>${need}</b> ใบ ให้เหลือ ${S.hs} ใบ (เลือกแล้ว ${n})`:md=='aid'?`♻️ เลือกไพ่ที่จะทิ้ง <b>${need}</b> ใบ (เลือกแล้ว ${n})`:`🌪️ Firestorm: เลือกไพ่ที่จะทิ้งแล้วจั่วใหม่ (ไม่เลือกก็ได้) · เลือกแล้ว ${n}`;
  bt=[B_('ok','ยืนยัน','pri',need&&n!=need)];
 }
 else if(U.m=='bucket'){t='🪣 แตะกลางพื้นที่ 3×3 ที่จะดับ (ต้องมีไฟในหอคอยตัวเอง)';bt=[B_('ok','ยืนยัน','pri',U.R==null),B_('x','ยกเลิก')]}
 else if(S.phase=='spread'){t=`🔥 <b>ขั้นที่ 1</b> ลามไฟตามลม ${AR[S.wind]} — แตะช่องที่เรืองแสง`;if(P.bucket)bt=[B_('bk','🪣 ใช้ถังน้ำ')]}
 else if(U.m=='disc'){const n=U.sel.length;t=`♻️ เลือกไพ่ที่จะทิ้ง (${n}) แล้วจั่วให้ครบ ${S.hs} ใบ`;bt=[B_('ok','ยืนยัน','pri',!n),B_('x','ยกเลิก')]}
 else if(U.m=='reck'){t=`🔥 <b>Reckless Abandon</b> เลือกไพ่น้ำ 3 ใบ หรือแนวกันไฟ 3 ใบ (${U.sel.length}/3) แล้วแตะ 2 ช่องที่ติดกองไฟ (${U.cs.length}/2)`;bt=[B_('ok','ยืนยัน','pri',U.sel.length!=3||U.cs.length!=2),B_('x','ยกเลิก')]}
 else if(U.m=='card'){
  const c=CARDS[U.id],k=c.key;
  if(c.k=='wind'){
   if(U.sub=='gem'){t=`💨 แตะช่องเพื่อวางไฟทิศ ${DN[k]}`;bt=[B_('x','ยกเลิก')]}
   else{t=`<b>${c.n}</b> — เลือกวิธีใช้`;bt=[B_('ws',`ตั้งลม ${AR[k]}`),B_('wr','🎲 ทอยลมใหม่'),B_('wg','🔥 ลามไฟ 1 ช่อง'),B_('x','ยกเลิก')]}
  }else{
   t=k=='boom'?'💥 แตะกองไฟที่จะระเบิด':k=='smoke'?'🪂 แตะกองไฟศูนย์กลาง (ดับ 8 ช่องรอบ)':k=='ember'?(U.from==null?'☄️ แตะกองไฟที่จะย้าย':'☄️ แตะช่องปลายทาง'):`แตะช่องเพื่อวาง <b>${c.n}</b> แล้วกดหมุน/ยืนยัน`;
   bt=[c.p&&c.p.length>1?B_('rot','↻ หมุน'):'',B_('ok','ยืนยัน','pri',!mv()||U.err),B_('x','ยกเลิก')];
  }
 }
 else{t='🃏 <b>ขั้นที่ 2</b> แตะการ์ด 1 ใบจากมือ หรือเลือก';bt=[B_('dc','♻️ ทิ้ง/จั่วใหม่'),P.bucket?B_('bk','🪣 ถังน้ำ'):B_('rk','🔥 Reckless Abandon')]}
 $('#bar').innerHTML=`<div>${t}</div><div class="row">${bt.join('')}</div>${U.err?`<div class="er">⚠️ ${U.err}</div>`:''}`;
}
function rHand(){
 const P=S.players[me],now=Date.now();
 for(const k in aH)if(now>aH[k]+900)delete aH[k];
 let n=0;P.hand.forEach(id=>{if(!aH[id]&&(!pH||!pH.includes(id)))aH[id]=now+(n++)*130});
 pH=P.hand.slice();
 $('#hand').innerHTML=P.burned?'<div class="mu">หอคอยของคุณถูกเผา 🔥 ดูเกมต่อได้เลย 👀</div>':P.hand.map(id=>{const a=aH[id],sel=(U.sel||[]).includes(id)||U.m=='card'&&U.id==id;return card(id,(sel?'sel ':'')+(a?'deal':''),a?`style="animation-delay:${a-now}ms"`:'',1)}).join('')||'<div class="mu">ไม่มีไพ่ในมือ</div>';
}
function rLog(){$('#lgb').innerHTML=S.log.slice(-25).reverse().map(l=>`<div style="color:${LC[l.ty]}">${l.t}</div>`).join('')}
const rAll=()=>{rTop();rPl();rBoard();rBar();rHand()};
function rOver(){
 beep(880,.5);confetti();
 const out=S.out||[],rank=[S.win,...out.slice().reverse()].filter((x,i,a)=>x>=0&&a.indexOf(x)==i);
 S.players.forEach(p=>rank.includes(p.id)||rank.push(p.id));
 const d=Math.max(1,Math.round(((S.t1||Date.now())-S.t0)/1000)),st=S.st||[],tn=st.reduce((a,x)=>a+x.t,0),mx=Math.max(0,...st.map(x=>x.x)),mc=Math.max(0,...st.map(x=>x.c));
 const rows=rank.map((id,i)=>{const p=S.players[id],q=st[id]||{t:0,c:0,x:0},tg=[q.x&&q.x==mx?'🔥 นักเผาหอคอย':'',q.c&&q.c==mc?'🃏 เล่นการ์ดมากสุด':''].filter(Boolean).map(t=>`<span class="sp g">${t}</span>`).join('');
  return`<div class="rk ${i?'':'w'}"><span class="md2">${['🥇','🥈','🥉','🏅'][i]}</span><span class="av">${AV[p.seat]}</span><div style="flex:1"><b>${p.name}${id==me?' (คุณ)':''}</b><div class="mu">${i?`🗼 ถูกเผาเป็นคนที่ ${out.indexOf(id)+1}`:'👑 หอคอยสุดท้ายที่รอด'}</div><div><span class="sp">🔥 เผา ${q.x} หอ</span><span class="sp">🃏 ${q.c} ใบ</span><span class="sp">🔁 ${q.t} ตา</span>${tg}</div></div></div>`}).join('');
 modal(`<div class="sum"><div class="trophy">🏆</div><h2>${S.players[S.win].name} ชนะเกม!</h2><p class="mu">หอคอยสุดท้ายที่รอดจากเปลวไฟ 🔥</p>${rows}<div class="stats"><span>⏱️ ${d/60|0} นาที ${d%60} วิ</span><span>🔁 ${tn} ตา</span><span>🌪️ Firestorm ${S.ns||0} ครั้ง</span><span>🔥 ไฟบนกระดาน ${S.b.filter(v=>v==1).length} กอง</span></div>${mode=='test'||me==0?'<button class="pri" id="again" style="width:100%;margin-top:8px">🔄 เล่นอีกครั้ง</button>':'<p class="mu">⏳ รอหัวหน้าห้องเริ่มรอบใหม่…</p>'}</div>`);
}
$('#md').onclick=e=>{
 if(e.target.id=='again'){$('#md').innerHTML='';mode=='test'?startTest(S.players.length):raw({t:'again'});return}

function update(){
 if(mode=='test')me=T.bots?0:FT.who(S);
 const fresh=S.log.filter(l=>l.i>seen);
 fresh.slice(-3).forEach(l=>{toast(l.t,LC[l.ty]);if(l.ty=='burn')beep(150,.4);if(l.ty=='storm')beep(240,.3)});
 const bl=fresh.find(l=>l.ty=='burn')||fresh.find(l=>l.ty=='storm')||fresh.find(l=>l.ty=='aid'&&l.t.includes('เปิดการ์ด'));
 if(bl)banner(bl.ty=='burn'?bl.t:bl.ty=='storm'?'🌪️ FIRESTORM!':'🤝 MUTUAL AID',bl.ty=='burn'?'#ef4444':bl.ty=='storm'?'#a855f7':'#eab308');
 if(S.log.length)seen=S.log[S.log.length-1].i;
 const w=FT.who(S);
 if(w!=lw){if(mode=='online'&&w==me&&!S.over){beep(700);toast('🔔 ถึงตาคุณแล้ว!','#22c55e');setTimeout(()=>banner('🔔 ถึงตาคุณ!','#22c55e'),bl?1800:0);navigator.vibrate&&navigator.vibrate(120)}lw=w}
 if(U.m&&w!=me)U={};
 diffB();if(pW&&pW!=S.wind)windFx(S.wind);pW=S.wind;rAll();rLog();
 if(S.over&&!lo){lo=1;setTimeout(rOver,600)}if(!S.over)lo=0;
}

$('#board').onclick=e=>{
 const el=e.target.closest('.c');if(!el)return;const i=+el.dataset.i;
 if(mode=='test'&&$('#dedit').checked){const v=T.S.b[i];if(v<3){T.S.b[i]=(v+1)%3;S=T.S;update()}return}
 if(!mine())return;
 const cur=S.pq[0];
 if(cur){if(cur.t=='aid')send({t:'aid',cell:i});return}
 if(U.m=='bucket'){U.R=i/N|0;U.C=i%N}
 else if(S.phase=='spread'){send({t:'spread',cell:i});return}
 else if(U.m=='reck'){const k=U.cs.indexOf(i);k<0?U.cs.length<2&&U.cs.push(i):U.cs.splice(k,1)}
 else if(U.m=='card'){
  const c=CARDS[U.id],k=c.key;
  if(c.k=='wind'){if(U.sub=='gem')send({t:'card',id:U.id,mode:'gem',cell:i});return}
  if(k=='boom'||k=='smoke')U.cell=i;
  else if(k=='ember'){if(U.from==null)U.from=i;else U.to=i}
  else{U.R=i/N|0;U.C=i%N}
 }
 rAll();
};
$('#hand').onclick=e=>{

 else if(S.phase=='action')U={m:'card',id,q:0};
 rAll();
};
function ok(){

 if(cur&&cur.t=='disc')return send({t:'disc',ids:U.sel||[]});

}

 ({x:()=>{U={};rAll()},rot:()=>{U.q=(U.q+1)&3;rAll()},ok,bk:()=>{U={m:'bucket'};rAll()},dc:()=>{U={m:'disc',sel:[]};rAll()},rk:()=>{U={m:'reck',sel:[],cs:[]};rAll()},
